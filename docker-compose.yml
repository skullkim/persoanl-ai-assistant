services:
  app:
    build: .
    container_name: ai-assistant-app
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      TZ: Asia/Seoul
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  batch:
    build: .
    container_name: ai-assistant-batch
    restart: unless-stopped
    init: true
    command: supercronic /app/crontab
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      TZ: Asia/Seoul
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
